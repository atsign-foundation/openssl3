name: openssl3_tool
description: >-
  Repository tooling for package:openssl3: command-line entry points around the
  build/link/verify pipeline in package:openssl3/src/native_build, plus
  manifest, symbol-table and bindings generators. Not published.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  openssl3: any
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
