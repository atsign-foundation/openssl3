name: openssl3_e2e
description: >-
  End-to-end test for package:openssl3, in the spirit of iperf3: a client
  streams authenticated-encrypted data to a server over TCP after a hybrid
  X25519 + ML-KEM-768 handshake signed with ML-DSA-65, and both sides report
  throughput. Not published.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.6.0
  openssl3: any

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
