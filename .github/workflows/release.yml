name: Release

# Two-step release (ADR-0007):
#
#  1. Push tag `v<version>` (e.g. v3.5.8+1 is not a valid git ref, so tags use
#     `v3.5.8-1`; see CONTRIBUTING.md). This job builds every native library,
#     creates a DRAFT GitHub release with the binaries + manifest.json, then
#     regenerates lib/src/manifest.dart from the exact uploaded bytes and opens
#     the "release hashes" PR.
#  2. When that PR merges, `release-check` re-asserts manifest.dart against the
#     release assets, runs `dart pub publish --dry-run` and pana, moves the tag
#     to the merge commit and publishes the draft release. Publishing to
#     pub.dev is done BY HAND by the maintainer from that commit.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  pull_request:
    types: [closed]
    branches: [trunk]

permissions: {}

jobs:
  # ---------------------------------------------------------------- step 1
  natives:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-natives.yml
    permissions:
      id-token: write
      attestations: write
      contents: read
    with:
      tag: ${{ github.ref_name }}
      attest: true

  draft-release:
    if: github.event_name == 'push'
    needs: natives
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openssl3-prebuilt
          path: out/
      - name: Version sanity (tag v3.5.8-1 <-> pubspec 3.5.8+1)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"; expected="${expected/-/+}"
          actual=$(grep -E '^version:' packages/openssl3/pubspec.yaml | awk '{print $2}')
          echo "tag=$TAG expects pubspec version $expected, found $actual"
          test "$expected" = "$actual"
      - name: Regenerate lib/src/manifest.dart from the release bytes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dart run tool/bin/write_manifest.dart --out out --tag "$TAG" --require-all
          git diff --stat
      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create --draft --verify-tag "$TAG" --title "$TAG" \
            --notes "Draft: prebuilt OpenSSL libcrypto for package:openssl3 $TAG. Published once the release-hashes PR merges." \
            out/*.so out/*.dylib out/*.dll out/*.zip out/*.json out/*.sha256
      - name: Open the release-hashes PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # The checkout is on a tag, so the action cannot infer the base.
          base: trunk
          branch: release/${{ github.ref_name }}-hashes
          delete-branch: true
          add-paths: packages/openssl3/lib/src/manifest.dart
          commit-message: |
            chore(release): pin ${{ github.ref_name }} asset hashes

            Generated by tool/bin/write_manifest.dart from the assets uploaded to
            the draft release ${{ github.ref_name }}. Hashes never enter the repo by
            hand (ADR-0007).
          title: 'chore(release): pin ${{ github.ref_name }} asset hashes'
          body: |
            Draft release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

            Merging this PR makes the package self-consistent for `${{ github.ref_name }}`:
            `lib/src/manifest.dart` now names that release and the sha256 of every asset.
            On merge, `release-check` re-verifies the hashes against the uploaded bytes,
            runs `dart pub publish --dry-run` + pana, moves the tag and publishes the release.

            **Then publish to pub.dev by hand** from the merge commit:

                git checkout ${{ github.ref_name }} && cd packages/openssl3 && dart pub publish
          labels: release-hashes

  # ---------------------------------------------------------------- step 2
  release-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release-hashes')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Tag from branch name
        id: tag
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          tag="${BRANCH#release/}"; tag="${tag%-hashes}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download the draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release download "$TAG" --dir out
      # Each asset must carry a Sigstore provenance attestation signed by THIS
      # repository's build-natives.yml running for THIS tag (ADR-0011). A byte
      # swapped on the draft release, or a file built anywhere else, fails
      # here, before any hash is trusted or the tag is moved.
      - name: Verify build provenance of every downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          n=0
          for f in out/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-natives.yml" \
              --source-ref "refs/tags/$TAG"
            n=$((n + 1))
          done
          echo "::notice::$n release assets carry provenance from build-natives.yml@refs/tags/$TAG"
      - name: Assert manifest.dart matches the release bytes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: dart run tool/bin/write_manifest.dart --out out --tag "$TAG" --require-all --assert
      - name: Hook downloads and verifies from the real release URL
        working-directory: packages/openssl3
        run: dart test --exclude-tags ffi
      - name: Publish dry run + pana
        working-directory: packages/openssl3
        run: |
          dart pub publish --dry-run
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .
      - name: Move tag to the merge commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f "$TAG" "${{ github.event.pull_request.merge_commit_sha }}"
          git push -f origin "refs/tags/$TAG"
          ver=$(grep -oE "opensslVersion: '[0-9.]+'" packages/openssl3/lib/src/manifest.dart | grep -oE '[0-9.]+')
          notes="Prebuilt OpenSSL $ver libcrypto for package:openssl3. Install: \`dart pub add openssl3\`. Hashes pinned in lib/src/manifest.dart."
          gh release edit "$TAG" --draft=false --latest --notes "$notes"
          echo "::notice::Release $TAG published. Now run: git checkout $TAG && cd packages/openssl3 && dart pub publish"
