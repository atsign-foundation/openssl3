name: Offline builds

# Proves the air-gapped paths: with GitHub blackholed, `local_path` and a
# `url_pattern` mirror on localhost both work, a warm cache needs no network,
# and a wrong sha256 fails closed.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 3'
  workflow_run:
    workflows: ['Build native libraries']
    types: [completed]
    branches: [trunk]

permissions:
  contents: read

jobs:
  offline:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Newest build-natives artifact
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-natives.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: openssl3-prebuilt
          path: out/
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: dart pub get
      - name: Build a manifest for these assets and start a localhost mirror
        run: |
          dart run tool/bin/write_manifest.dart --out out --tag vtest --dart-output /tmp/m.dart
          mkdir -p mirror/vtest && cp out/* mirror/vtest/
          (cd mirror && python3 -m http.server 8765 >/tmp/mirror.log 2>&1 &)
          sleep 1
      - name: Blackhole github.com (simulated air gap)
        run: |
          echo '127.0.0.1 github.com objects.githubusercontent.com release-assets.githubusercontent.com' | sudo tee -a /etc/hosts
          curl -sS -m 5 https://github.com/ && exit 1 || echo "github.com unreachable: good"
      - name: url_pattern mirror + manifest_override downloads and verifies
        working-directory: example/cli
        run: |
          # Replace the workspace's test_directory with a mirror + manifest.
          sed -i.bak '/test_directory: out/d' ../../pubspec.yaml
          printf '      url_pattern: "http://127.0.0.1:8765/$RELEASE_TAG/$FILENAME"\n      manifest_override: out/manifest.json\n' >> ../../pubspec.yaml
          tail -5 ../../pubspec.yaml
          # The manifest-writing step already ran the hook (test_directory mode)
          # and cached the very same bytes by digest; clear it so this build
          # must go to the mirror.
          rm -rf ../../.dart_tool/hooks_runner
          dart build cli
          # The hooks runner hides hook stdout on success; the mirror's request
          # log is the evidence that the library came from the mirror.
          grep -q "GET /vtest/libopenssl3_crypto" /tmp/mirror.log
          cp /tmp/mirror.log /tmp/mirror.after-first-build.log
          bin=$(find build -type f -path '*/bundle/bin/*' -name 'openssl3_example_cli*' | head -1); "$bin"
      - name: Warm cache needs no network at all
        working-directory: example/cli
        run: |
          # Mirror down: the build must still succeed from the warm cache.
          pkill -f "http.server 8765" || true
          rm -rf build ../../.dart_tool/hooks_runner
          dart build cli
          bin=$(find build -type f -path '*/bundle/bin/*' -name 'openssl3_example_cli*' | head -1); "$bin"
      - name: A tampered mirror fails closed
        working-directory: example/cli
        env:
          EXT: ${{ matrix.target == 'macos-arm64' && 'macos.dylib' || 'linux.so' }}
        run: |
          (cd ../../mirror && python3 -m http.server 8765 >/tmp/mirror.log 2>&1 &)
          sleep 1
          f=$(ls ../../mirror/vtest/libopenssl3_crypto.*.$EXT | head -1)
          printf '\x00' | dd of="$f" bs=1 seek=100 count=1 conv=notrunc
          # Drop the warm cache so the hook must fetch again.
          find ../.. -type d -name 'download-*' -path '*shared*' -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf build ../../.dart_tool/hooks_runner
          set +e; dart build cli > build3.log 2>&1; code=$?; set -e
          tail -5 build3.log
          test $code -ne 0
          grep -q 'sha256' build3.log
      - name: local_path (verified against the manifest)
        working-directory: example/cli
        env:
          EXT: ${{ matrix.target == 'macos-arm64' && 'macos.dylib' || 'linux.so' }}
        run: |
          # Restore an untampered copy and point local_path at it.
          lib=$(ls ../../out/libopenssl3_crypto.*.$EXT | head -1)
          cp ../../out/manifest.json /tmp/manifest.json
          sed -i.bak '/url_pattern:/d; /manifest_override:/d' ../../pubspec.yaml
          printf '      local_path: %s\n      manifest_override: /tmp/manifest.json\n' "$lib" >> ../../pubspec.yaml
          tail -4 ../../pubspec.yaml
          rm -rf build ../../.dart_tool/hooks_runner
          dart build cli
          bin=$(find build -type f -path '*/bundle/bin/*' -name 'openssl3_example_cli*' | head -1); "$bin"
