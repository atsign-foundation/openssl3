name: Build native libraries

# Builds libopenssl3_crypto for every supported target with the toolchains the
# OpenSSL project itself uses (ADR-0004), verifies each binary, and merges the
# results plus manifest.json into one `openssl3-prebuilt` artifact.
# Called by release.yml; also runs on demand and when the build pipeline or
# the pinned OpenSSL changes.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to record in manifest.json (empty = none)'
        type: string
        default: ''
      attest:
        description: 'Attest build provenance'
        type: boolean
        default: false
    outputs:
      artifact_id:
        description: 'Artifact id of the merged prebuilt libraries'
        value: ${{ jobs.merge.outputs.artifact_id }}
  workflow_dispatch:
  push:
    branches: [trunk]
    paths:
      - 'third_party/openssl'
      - 'packages/openssl3/lib/src/native_build/**'
      - 'packages/openssl3/src/native/**'
      - 'tool/**'
      - '.github/workflows/build-natives.yml'

permissions: {}

env:
  # OpenSSL 3.5.x needs nothing newer; keep Dart at the SDK floor + 1 line.
  DART_SDK: stable

jobs:
  linux-glibc:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}
      - run: dart pub get
      # Build inside a manylinux_2_28 image (glibc 2.28: RHEL 8, Debian 10,
      # Ubuntu 20.04 and newer) instead of the runner image's glibc 2.39. These
      # images are what the Python ecosystem uses for portable Linux binaries;
      # they ship gcc, perl and binutils. The Dart tooling stays on the host and
      # drives the container (same mechanism as the musl builds, ADR-0004).
      # Images are pinned by digest (ADR-0011): the image defines the compiler
      # that produces the shipped binary. Refresh with
      # `docker buildx imagetools inspect quay.io/pypa/manylinux_2_28_<arch>:latest`.
      - name: Start manylinux_2_28 build container
        run: |
          arch=$(uname -m)   # x86_64 or aarch64
          case "$arch" in
            x86_64)  digest=sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c ;;
            aarch64) digest=sha256:ad74e53b713f3b07d8c889c526dc0c6500da9827b45e38739570875fef52e28f ;;
            *) echo "no pinned manylinux image for $arch"; exit 1 ;;
          esac
          docker run -d --name buildbox -v "$PWD:$PWD" -w "$PWD" "quay.io/pypa/manylinux_2_28_${arch}@${digest}" sleep infinity
          # The image's perl is minimal; OpenSSL's Configure needs the core modules.
          docker exec buildbox sh -c 'dnf -y -q install perl-core >/dev/null'
          docker exec buildbox sh -c 'gcc --version | head -1; ldd --version | head -1; perl --version | grep -o "v5[0-9.]*"'
      - name: Build
        run: dart run tool/bin/build_openssl.dart ${{ matrix.target }} --out out --docker buildbox
      - name: glibc floor is 2.28 or lower
        run: |
          docker exec -w "$PWD" buildbox sh -c 'objdump -T out/libopenssl3_crypto.*.linux.so | grep -oE "GLIBC_[0-9.]+" | sort -uV | tail -3'
          max=$(docker exec -w "$PWD" buildbox sh -c 'objdump -T out/libopenssl3_crypto.*.linux.so | grep -oE "GLIBC_[0-9]+\.[0-9]+" | sort -uV | tail -1')
          echo "highest glibc symbol version: $max"
          test "$(printf '%s\n' "$max" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28
      - name: Smoke test (inside the build container)
        run: |
          docker exec -w "$PWD" buildbox sh -c 'gcc -O2 -o /tmp/smoke tool/native/smoke_dlopen.c -ldl && /tmp/smoke out/libopenssl3_crypto.*.linux.so'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 3

  linux-riscv64:
    name: linux-riscv64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}
      - name: Install cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user
      - run: dart pub get
      - name: Build
        run: dart run tool/bin/build_openssl.dart linux-riscv64 --out out
      - name: Smoke test (qemu-user)
        env:
          QEMU_CPU: rv64,v=true,vext_spec=v1.0
        run: |
          riscv64-linux-gnu-gcc -O2 -o smoke tool/native/smoke_dlopen.c -ldl
          qemu-riscv64 -L /usr/riscv64-linux-gnu ./smoke out/libopenssl3_crypto.riscv64.linux.so
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-riscv64
          path: out/
          if-no-files-found: error
          retention-days: 3

  linux-arm:
    name: linux-arm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}
      - run: dart pub get
      # Cross-compile inside an ubuntu:22.04 container so the glibc floor is
      # 2.35 (Debian 12 "bookworm", Raspberry Pi OS bookworm, Ubuntu 22.04 and
      # newer) instead of the runner's 2.39. Same Debian cross-gcc family as
      # OpenSSL's cross-compiles.yml; armv7-a hard-float is what Dart's
      # linux-arm SDK targets.
      - name: Start ubuntu:22.04 cross build container
        run: |
          docker run -d --name buildbox -v "$PWD:$PWD" -w "$PWD" ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc sleep infinity
          docker exec buildbox sh -c 'apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross binutils make perl qemu-user ca-certificates >/dev/null'
          docker exec buildbox sh -c 'arm-linux-gnueabihf-gcc --version | head -1; dpkg -s libc6-armhf-cross | grep ^Version; perl --version | grep -o "v5[0-9.]*"'
      - name: Build
        run: dart run tool/bin/build_openssl.dart linux-arm --out out --docker buildbox
      - name: glibc floor is 2.35 or lower
        run: |
          docker exec -w "$PWD" buildbox sh -c 'objdump -T out/libopenssl3_crypto.arm.linux.so | grep -oE "GLIBC_[0-9.]+" | sort -uV | tail -3'
          max=$(docker exec -w "$PWD" buildbox sh -c 'objdump -T out/libopenssl3_crypto.arm.linux.so | grep -oE "GLIBC_[0-9]+\.[0-9]+" | sort -uV | tail -1')
          echo "highest glibc symbol version: $max"
          test "$(printf '%s\n' "$max" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35
      - name: Smoke test (qemu-user, inside the build container)
        run: |
          docker exec -w "$PWD" buildbox sh -c 'arm-linux-gnueabihf-gcc -O2 -o /tmp/smoke tool/native/smoke_dlopen.c -ldl && qemu-arm -L /usr/arm-linux-gnueabihf /tmp/smoke out/libopenssl3_crypto.arm.linux.so'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-arm
          path: out/
          if-no-files-found: error
          retention-days: 3

  linux-musl:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_musl-x64
            runner: ubuntu-24.04
          - target: linux_musl-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}
      - run: dart pub get
      # The Dart SDK is glibc-only, so the tooling stays on the host and drives
      # perl/gcc/binutils inside an alpine container mounted at the same path
      # (os-zoo.yml style, ADR-0004).
      - name: Start alpine build container
        run: |
          docker run -d --name buildbox -v "$PWD:$PWD" -w "$PWD" alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc sleep infinity
          docker exec buildbox apk add --no-cache build-base perl linux-headers binutils
      - name: Build
        run: dart run tool/bin/build_openssl.dart ${{ matrix.target }} --out out --docker buildbox
      - name: Smoke test (inside alpine)
        run: |
          docker exec -w "$PWD" buildbox gcc -O2 -o smoke tool/native/smoke_dlopen.c -ldl
          docker exec -w "$PWD" buildbox ./smoke out/libopenssl3_crypto.*.linux_musl.so
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 3

  apple:
    name: macOS + iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}
      - run: dart pub get
      - name: Build all Apple targets
        run: |
          for t in macos-arm64 macos-x64 ios-arm64 ios_sim-arm64 ios_sim-x64; do
            dart run tool/bin/build_openssl.dart "$t" --out out
          done
      - name: Smoke test (host arch)
        run: |
          clang -O2 -o smoke tool/native/smoke_dlopen.c
          ./smoke out/libopenssl3_crypto.arm64.macos.dylib
      - name: xcframework (convenience artifact)
        run: tool/ci/make_xcframework.sh out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-apple
          path: out/
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}
      - run: dart pub get
      - name: Build all Android ABIs
        run: |
          # ANDROID_NDK_LATEST_HOME is a runner environment variable (not a
          # workflow env), so read it in the shell.
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK: $ANDROID_NDK_ROOT"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1
          for t in android-arm64 android-arm android-x64; do
            dart run tool/bin/build_openssl.dart "$t" --out out
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-android
          path: out/
          if-no-files-found: error
          retention-days: 3

  windows:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            msvc_arch: x64
          - target: windows-arm64
            msvc_arch: amd64_arm64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Perl
        run: |
          perl --version | Select-String -Pattern "This is perl"
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: dart pub get
      - name: Build
        run: dart run tool/bin/build_openssl.dart ${{ matrix.target }} --out out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 3

  merge:
    name: Merge + manifest
    needs: [linux-glibc, linux-arm, linux-riscv64, linux-musl, apple, android, windows]
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tarball check below needs the pinned OpenSSL tree.
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}
      - run: dart pub get
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: out/
          merge-multiple: true
      # The tarball hash recorded here is what `local_build` consumers trust,
      # so it must be shown to be the release OpenSSL signed AND the code the
      # prebuilt binaries came from (ADR-0011). Three independent checks:
      #  1. the checksum published next to it (catches truncation only);
      #  2. the detached PGP signature, from a key whose fingerprint the pinned
      #     source tree itself lists in doc/fingerprints.txt (keys fetched from
      #     openssl-library.org, a different origin from the tarball);
      #  3. byte-for-byte equality with `git archive` of the pinned submodule
      #     commit, which is exactly how upstream's util/mktar.sh builds it.
      - name: Fetch and verify the upstream source tarball (for local_build)
        run: |
          set -euo pipefail
          ver=$(python3 -c "import json,glob; print(json.load(open(glob.glob('out/*.json')[0]))['openssl_version'])")
          base="https://github.com/openssl/openssl/releases/download/openssl-$ver"
          curl -sSfL -o "openssl-$ver.tar.gz" "$base/openssl-$ver.tar.gz"
          curl -sSfL -o upstream.sha256 "$base/openssl-$ver.tar.gz.sha256"
          curl -sSfL -o "openssl-$ver.tar.gz.asc" "$base/openssl-$ver.tar.gz.asc"

          echo "::group::1. published checksum"
          echo "upstream says: $(cat upstream.sha256)"
          sha256sum "openssl-$ver.tar.gz" | tee "out/openssl-$ver.tar.gz.sha256"
          test "$(awk '{print $1}' upstream.sha256)" = "$(awk '{print $1}' out/openssl-$ver.tar.gz.sha256)"
          echo "::endgroup::"

          echo "::group::2. PGP signature from an authorised release signer"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          fprs=$(grep -E '^([0-9A-F]{4} ){9}[0-9A-F]{4}$' third_party/openssl/doc/fingerprints.txt | tr -d ' ')
          if curl -sSfL -o pubkeys.asc https://openssl-library.org/source/pubkeys.asc; then
            gpg --batch --import pubkeys.asc
          else
            echo "::warning::openssl-library.org unreachable; fetching the listed fingerprints from keyserver.ubuntu.com"
            # shellcheck disable=SC2086
            gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys $fprs
          fi
          status=$(gpg --batch --status-fd 1 --verify "openssl-$ver.tar.gz.asc" "openssl-$ver.tar.gz" 2>/dev/null || true)
          echo "$status"
          echo "$status" | grep -q '^\[GNUPG:\] GOODSIG ' || { echo "::error::openssl-$ver.tar.gz.asc is not a good signature"; exit 1; }
          primary=$(echo "$status" | awk '/^\[GNUPG:\] VALIDSIG/ {print $NF}')
          echo "$fprs" | grep -qix "$primary" || { echo "::error::signer $primary is not listed in third_party/openssl/doc/fingerprints.txt"; exit 1; }
          echo "signed by $primary, listed in the pinned tree's doc/fingerprints.txt"
          echo "::endgroup::"

          echo "::group::3. tarball == git archive of the pinned submodule"
          mkdir -p /tmp/tarball /tmp/submodule
          tar -xzf "openssl-$ver.tar.gz" -C /tmp/tarball
          git -C third_party/openssl archive --worktree-attributes --prefix="openssl-$ver/" HEAD | tar -x -C /tmp/submodule
          diff -r "/tmp/tarball/openssl-$ver" "/tmp/submodule/openssl-$ver"
          echo "identical to submodule commit $(git -C third_party/openssl rev-parse HEAD) ($(find /tmp/submodule -type f | wc -l) files)"
          echo "::endgroup::"
      - name: Write manifest.json (all targets required)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ls -la out/
          args=(--out out --require-all --dart-output /tmp/manifest.dart)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          dart run tool/bin/write_manifest.dart "${args[@]}"
          cat out/manifest.json
      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Every file that reaches the release, sidecars included, so the
          # release gate can verify the whole download (release.yml).
          subject-path: |
            out/*.so
            out/*.dylib
            out/*.dll
            out/*.zip
            out/*.json
            out/*.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: openssl3-prebuilt
          path: out/
          if-no-files-found: error
          retention-days: 14
