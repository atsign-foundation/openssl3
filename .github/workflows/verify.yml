name: Verify consumers

# Proves the "definition of done" on clean machines: `dart pub add openssl3`
# style consumption with NO OpenSSL, Perl or C compiler needed at build time,
# through `dart build cli` and `flutter build` on every desktop OS, iOS
# simulator and an Android emulator. Uses the prebuilt libraries from the most
# recent build-natives run (or a release) via `test_directory`, so it can run
# before a release exists.

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 2'
  workflow_run:
    workflows: ['Build native libraries']
    types: [completed]
    branches: [trunk]

permissions:
  contents: read

jobs:
  fetch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      - name: Pick the newest successful build-natives run
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-natives.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

  dart-cli:
    name: dart build cli (${{ matrix.name }})
    needs: fetch
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64 debian-slim
            runner: ubuntu-24.04
            container: debian:bookworm-slim
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: linux_musl-x64 alpine
            runner: ubuntu-24.04
            container: alpine:3.20
            musl: true
          - name: macos-arm64
            runner: macos-15
          - name: windows-x64
            runner: windows-2022
          - name: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ${{ matrix.container }}
    steps:
      - name: Container prerequisites (no compilers, no openssl)
        if: matrix.container != ''
        shell: sh
        run: |
          # No git on purpose: actions/checkout falls back to the REST API, and
          # git would pull perl into the image. No compilers, no openssl.
          if command -v apk >/dev/null; then apk add --no-cache bash curl unzip gcompat; \
          else apt-get update && apt-get install -y --no-install-recommends ca-certificates curl unzip; fi
          # ca-certificates depends on the openssl *binary*, so only compilers
          # can be asserted absent here; the bundle's dependencies are checked
          # with ldd after the build instead.
          for t in cc gcc clang; do command -v $t && { echo "$t present in the 'clean' image"; exit 1; }; done
          echo "no C compiler present: good"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openssl3-prebuilt
          path: out/
          run-id: ${{ needs.fetch.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Force the musl build where the host is musl
        if: matrix.musl == true
        run: |
          printf '\n      linux_libc: musl\n' >> pubspec.yaml
          tail -6 pubspec.yaml
      - run: dart pub get
      - name: dart build cli + run bundle
        working-directory: example/cli
        shell: bash
        run: |
          dart build cli
          bin=$(find build -type f -path '*/bundle/bin/*' -name 'openssl3_example_cli*' | head -1)
          ls -la "$(dirname "$bin")/../lib"
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "$(dirname "$bin")"/../lib/libopenssl3_crypto.so | tee ldd.txt
            ! grep -qE 'libcrypto|libssl' ldd.txt || { echo "bundle depends on a system OpenSSL"; exit 1; }
          fi
          "$bin" --json | tee result.json
          grep -q '"failures":0' result.json
      - name: End-to-end selftest from a dart build cli bundle
        working-directory: example/e2e
        shell: bash
        run: |
          dart build cli
          bin=$(find build -type f -path '*/bundle/bin/*' -name 'openssl3_e2e*' | head -1)
          "$bin" selftest --bytes 64M
      - name: dart compile exe is NOT supported (documented behaviour)
        working-directory: example/cli
        shell: bash
        run: |
          set +e
          out=$(dart compile exe bin/openssl3_example_cli.dart -o /tmp/x 2>&1); code=$?
          set -e
          echo "$out"
          echo "$out" | grep -qi "does not support build hooks" || { echo "::warning::dart compile exe behaviour changed; update README"; }
          echo "::notice::dart compile exe exit=$code (expected non-zero: hooks unsupported, use dart build cli)"

  # 32-bit ARM has no GitHub runner: run Dart's linux-arm SDK inside an
  # arm32v7 Debian container under qemu-user (docker/setup-qemu-action). Slow,
  # but it is the real consumer path for Raspberry Pi class devices.
  dart-cli-arm32:
    name: dart build cli (linux-arm, qemu)
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openssl3-prebuilt
          path: out/
          run-id: ${{ needs.fetch.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm
      # Resolve on the host into a pub cache inside the workspace; the container
      # then runs `pub get --offline` (the slim image has no CA certificates and
      # network under qemu is slow anyway). Same paths on both sides.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Populate the pub cache on the host
        env:
          PUB_CACHE: ${{ github.workspace }}/.pub-cache
        run: dart pub get
      - name: Dart SDK version to mirror (stable)
        id: dart
        run: |
          v=$(curl -sSfL https://storage.googleapis.com/dart-archive/channels/stable/release/latest/VERSION | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          curl -sSfL -o dartsdk.zip "https://storage.googleapis.com/dart-archive/channels/stable/release/$v/sdk/dartsdk-linux-arm-release.zip"
          unzip -q dartsdk.zip && rm dartsdk.zip
          file dart-sdk/bin/dart | grep -q "ARM, EABI5" && echo "linux-arm SDK $v"
      - name: dart build cli + run bundle (arm32v7/debian:bookworm under qemu)
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:$PWD" -w "$PWD" -e PUB_CACHE="$PWD/.pub-cache" arm32v7/debian:bookworm-slim bash -ec '
            uname -m
            for t in cc gcc clang; do command -v $t && { echo "$t present in the clean image"; exit 1; }; done
            export PATH="$PWD/dart-sdk/bin:$PATH"
            dart --version
            dart pub get --offline
            cd example/cli
            dart build cli
            bin=$(find build -type f -path "*/bundle/bin/*" -name "openssl3_example_cli*" | head -1)
            ls -la "$(dirname "$bin")/../lib"
            ldd "$(dirname "$bin")"/../lib/libopenssl3_crypto.so | tee ldd.txt
            ! grep -qE "libcrypto|libssl" ldd.txt || { echo "bundle depends on a system OpenSSL"; exit 1; }
            "$bin" --json | tee result.json
            grep -q "\"failures\":0" result.json
          '

  flutter-desktop:
    name: flutter build ${{ matrix.platform }}
    needs: fetch
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Linux desktop prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openssl3-prebuilt
          path: out/
          run-id: ${{ needs.fetch.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build and run the integration test on the desktop
        working-directory: example/flutter_app
        shell: bash
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --debug
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a flutter test integration_test -d linux
          else
            flutter test integration_test -d ${{ matrix.platform }}
          fi

  flutter-ios-simulator:
    name: flutter build ios (simulator) + integration test
    needs: fetch
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openssl3-prebuilt
          path: out/
          run-id: ${{ needs.fetch.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Boot a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$udid" || true
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - working-directory: example/flutter_app
        run: |
          flutter pub get
          flutter build ios --simulator --debug
          flutter test integration_test -d ${{ steps.sim.outputs.udid }}
      - name: Device build compiles (no signing)
        working-directory: example/flutter_app
        run: flutter build ios --release --no-codesign

  flutter-android:
    name: flutter build apk + emulator integration test
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openssl3-prebuilt
          path: out/
          run-id: ${{ needs.fetch.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Build APK (all ABIs) and check 16 KB alignment of the bundled .so
        working-directory: example/flutter_app
        run: |
          flutter pub get
          flutter build apk --debug
          unzip -o build/app/outputs/flutter-apk/app-debug.apk 'lib/*/libopenssl3_crypto.so' -d /tmp/apk
          ls -la /tmp/apk/lib/*/
          for so in /tmp/apk/lib/*/libopenssl3_crypto.so; do
            "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "$so" | awk '/LOAD/ {print FILENAME": "$NF}' FILENAME="$so" | grep -v 0x4000 && exit 1 || true
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration test on an x86_64 emulator (API 35)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: example/flutter_app
          # DDS start-up on the emulator is flaky; one retry.
          script: flutter test integration_test -d emulator-5554 || flutter test integration_test -d emulator-5554

  local-build:
    name: local_build from source (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Compile libcrypto through the hook (source_path = submodule)
        working-directory: packages/openssl3
        run: dart test -t local_build --run-skipped
